//
// build.gradle in TeamCode
//

// Custom definitions may go here

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'
    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }


    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation libs.androidx.core.ktx
    implementation libs.alonlib
    testImplementation libs.alonlib.emulator

}
tasks.register("runEmulator", JavaExec) {
    group = "verification"
    dependsOn("assembleDebugUnitTest")
    classpath = tasks.named("testDebugUnitTest", Test).get().classpath
    mainClass = "org.firstinspires.ftc.teamcode.alonlib.emulator.EmulatorAutoLauncherKt"
}
